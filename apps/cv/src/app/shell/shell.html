<header class="shell-header">
  <ds-main-navbar [items]="navItems" [tabPanel]="panel">
    <ds-theme-switcher
      [themes]="themeService.themes"
      [theme]="themeService.theme()"
      (themeChange)="changeTheme($event)" />
    <ds-color-scheme-switcher
      [colorScheme]="themeService.colorScheme()"
      (colorSchemeChange)="changeColorScheme($event)" />
    <ds-language-switcher
      [languages]="languageService.languages"
      [language]="languageService.language()"
      (languageChange)="changeLanguage($event)" />
  </ds-main-navbar>
</header>

<mat-tab-nav-panel #panel class="shell-main">
  <main>
    <router-outlet />
  </main>
</mat-tab-nav-panel>

<footer class="shell-footer">© {{ year }} Axel Pauwels</footer>

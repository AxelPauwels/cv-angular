@if (isLoading()) {
<p>Loading…</p>
} @else if (isAvailable()) {
<a matButton class="open-link" [href]="src()" target="_blank" rel="noopener">
  Open in a new tab
  <mat-icon iconPositionEnd fontSet="material-symbols-outlined">
    open_in_new
  </mat-icon>
</a>
<iframe [src]="frameSrc()" [title]="title() | translate"></iframe>
} @else {
<p>
  This report is not available here. It is generated by the production build
  (<code>npm run build:production</code>).
</p>
}

<mat-toolbar class="main-navbar">
  <nav
    mat-tab-nav-bar
    class="main-navbar-tabs"
    [tabPanel]="tabPanel()"
    [attr.aria-label]="labelKey() | translate">
    @for (item of items(); track item.path) {
    <a
      mat-tab-link
      class="main-navbar-tab"
      [routerLink]="'/' + item.path"
      [active]="item === activeItem()">
      {{ item.labelKey | translate | uppercase }}
    </a>
    }
  </nav>

  <div class="main-navbar-actions">
    <ng-content />
  </div>
</mat-toolbar>

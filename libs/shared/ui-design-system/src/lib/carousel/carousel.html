<div class="ds-carousel__header">
  <ng-content select="[dsCarouselTitle]" />

  @if (pages() > 1) {
  <div class="ds-carousel__controls">
    <button
      matIconButton
      type="button"
      class="ds-carousel__button"
      [disabled]="page() === 0"
      [attr.aria-controls]="viewportId"
      [attr.aria-label]="'t.carousel.previous' | translate"
      (click)="step(-1)">
      <mat-icon fontSet="material-symbols-outlined">chevron_left</mat-icon>
    </button>
    <button
      matIconButton
      type="button"
      class="ds-carousel__button"
      [disabled]="page() === pages() - 1"
      [attr.aria-controls]="viewportId"
      [attr.aria-label]="'t.carousel.next' | translate"
      (click)="step(1)">
      <mat-icon fontSet="material-symbols-outlined">chevron_right</mat-icon>
    </button>
  </div>
  }
</div>

<div
  #viewport
  class="ds-carousel__viewport"
  role="region"
  tabindex="0"
  [id]="viewportId"
  [attr.aria-label]="label()"
  [attr.aria-roledescription]="'t.carousel.carousel' | translate"
  (scroll)="update()">
  <div #list class="ds-carousel__list" role="list">
    <ng-content />
  </div>
</div>

@if (pages() > 1) {
<div class="ds-carousel__pagination">
  @for (dot of dots(); track dot.index) {
  <button
    type="button"
    class="ds-carousel__dot"
    [attr.aria-controls]="viewportId"
    [attr.aria-current]="dot.index === page() ? 'true' : null"
    [attr.aria-label]="'t.carousel.page' | translate: dot.params"
    (click)="goTo(dot.index)"></button>
  }
</div>
}

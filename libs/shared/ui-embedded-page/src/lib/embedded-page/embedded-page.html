<ds-page-title [title]="title()" />

@if (loading.pending()) { @if (loading.indicator()) {
<mat-progress-bar mode="indeterminate" aria-label="Loading the report" />
} } @else if (isAvailable()) {
<div class="embedded-page__actions">
  <a matButton="outlined" [href]="src()" target="_blank" rel="noopener">
    Open in a new tab
    <mat-icon iconPositionEnd fontSet="material-symbols-outlined">
      open_in_new
    </mat-icon>
  </a>
</div>
<iframe
  class="embedded-page__frame"
  [src]="frameSrc()"
  [title]="title() | translate"
  (load)="applyFont()"></iframe>
} @else {
<p>
  This report is not available here. It is generated by the production build
  (<code>npm run build:production</code>).
</p>
}

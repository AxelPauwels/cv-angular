<mat-toolbar class="main-navbar">
  <div class="main-navbar__start">
    <ng-content select="[dsNavbarStart]" />
  </div>

  <nav
    mat-tab-nav-bar
    class="main-navbar__tabs"
    mat-stretch-tabs="false"
    [tabPanel]="tabPanel()"
    [attr.aria-label]="labelKey() | translate">
    @for (item of items(); track item.path) {
    <!-- An icon tab keeps its label as accessible name and tooltip (on hover and focus) -->
    <a
      mat-tab-link
      class="main-navbar__tab"
      [attr.data-tour]="item.tourId"
      [routerLink]="'/' + item.path"
      [active]="item === activeItem()"
      [attr.aria-label]="item.icon ? (item.labelKey | translate) : null"
      [matTooltip]="item.icon ? (item.labelKey | translate) : ''">
      @if (item.icon) {
      <mat-icon
        class="main-navbar__icon"
        fontSet="material-symbols-outlined"
        aria-hidden="true"
        >{{ item.icon }}</mat-icon
      >
      } @else {
      <span
        class="main-navbar__label"
        [attr.data-label]="item.labelKey | translate | uppercase"
        >{{ item.labelKey | translate | uppercase }}</span
      >
      }
    </a>
    }
  </nav>

  <div class="main-navbar__actions">
    <ng-content />
  </div>
</mat-toolbar>

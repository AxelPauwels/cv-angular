<mat-toolbar class="main-navbar">
  <div class="main-navbar__start">
    <ng-content select="[dsNavbarStart]" />
  </div>

  <nav
    mat-tab-nav-bar
    class="main-navbar__tabs"
    mat-stretch-tabs="false"
    [tabPanel]="tabPanel()"
    [attr.aria-label]="labelKey() | translate">
    @for (item of items(); track item.path) {
    <a
      mat-tab-link
      class="main-navbar__tab"
      [attr.data-tour]="item.tourId"
      [routerLink]="'/' + item.path"
      [active]="item === activeItem()">
      <span
        class="main-navbar__label"
        [attr.data-label]="item.labelKey | translate | uppercase"
        >{{ item.labelKey | translate | uppercase }}</span
      >
    </a>
    }
  </nav>

  <div class="main-navbar__actions">
    <ng-content />
  </div>
</mat-toolbar>

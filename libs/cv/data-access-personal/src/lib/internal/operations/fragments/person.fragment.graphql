fragment PersonFields on Person {
  firstName
  lastName
  functionTitle
  contact {
    address {
      street
      number
      postalCode
      city
      country
    }
    phone
    email
    website
    linkedIn
  }
  personal {
    dateOfBirth
    nationality
    maritalStatus
    children {
      name
      gender
    }
    personalityType
    driverLicense
  }
  hobbies {
    name
    comment
    icon
  }
  languages {
    isNativeLanguage
    language {
      isoCode
      locale
    }
    spoken
    written
  }
}

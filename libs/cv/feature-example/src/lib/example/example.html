<lib-mac-window>
  <h1>{{ title }}</h1>
</lib-mac-window>

<a mat-flat-button href="/e2e-report/index.html" target="_blank" rel="noopener">
  End to end test report
</a>
<a mat-flat-button href="/coverage/index.html" target="_blank" rel="noopener">
  Code coverage report
</a>

<mat-slide-toggle>Toggle me!</mat-slide-toggle>

<lib-wrapper [config]="cvMfe" />

<section>
  <label for="person-select">Person</label>
  <select
    id="person-select"
    [value]="selectedPersonId()"
    (change)="selectedPersonId.set($any($event.target).value)">
    @for (option of people.value()?.people ?? []; track option.id) {
    <option [value]="option.id">{{ option.name }}</option>
    }
  </select>

  @let selected = person.value()?.person; @if (person.isLoading()) {
  <p>Loading…</p>
  } @else if (selected) {
  <p>
    {{ selected.name }} is {{ selected.age }} years old (id {{ selected.id }})
  </p>
  } @else {
  <p>No person found.</p>
  }
</section>
<lib-mac-window>
  <lib-experience-list />
</lib-mac-window>

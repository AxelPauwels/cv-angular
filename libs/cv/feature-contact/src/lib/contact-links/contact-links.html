@if (links().length) {
<ul
  class="contact-links"
  [attr.aria-label]="'t.subheading.personal.connect' | translate">
  @for (link of links(); track link.href) {
  <!-- icon-only links: the label is the accessible name and, above the icon
       like the navbar icons' tooltips, shown on hover and focus -->
  @let label = link.translate ? (link.label | translate) : link.label;
  <li>
    @if (link.routerLink) {
    <a
      class="contact-links__link"
      [routerLink]="link.href"
      [attr.aria-label]="label"
      [matTooltip]="label"
      matTooltipPosition="above">
      <ds-lordicon class="contact-links__icon" [icon]="link.icon">
        <span class="cv-icon" [class]="'cv-icon-' + link.icon"></span>
      </ds-lordicon>
    </a>
    } @else {
    <a
      class="contact-links__link"
      [href]="link.href"
      [attr.aria-label]="label"
      [matTooltip]="label"
      matTooltipPosition="above">
      <ds-lordicon class="contact-links__icon" [icon]="link.icon">
        <span class="cv-icon" [class]="'cv-icon-' + link.icon"></span>
      </ds-lordicon>
    </a>
    }
  </li>
  }
</ul>
}

@if (links().length) {
<ul
  class="contact-links"
  [attr.aria-label]="'t.subheading.personal.connect' | translate">
  @if (aiAssistantLink(); as aiLink) {
  <!-- the AI assistant, before the mail link: a robot that glows every few seconds -->
  @let aiLabel = 't.contact.ai-assistant' | translate;
  <li>
    <a
      class="contact-links__link contact-links__link--ai"
      [routerLink]="aiLink"
      [attr.aria-label]="aiLabel"
      [matTooltip]="aiLabel"
      matTooltipPosition="above">
      <mat-icon
        class="contact-links__ai-icon"
        fontSet="material-symbols-outlined"
        aria-hidden="true"
        >smart_toy</mat-icon
      >
    </a>
  </li>
  } @for (link of links(); track link.href) {
  <!-- icon-only links: the label is the accessible name and, above the icon
       like the navbar icons' tooltips, shown on hover and focus -->
  @let label = link.translate ? (link.label | translate) : link.label;
  <li>
    @if (link.routerLink) {
    <a
      class="contact-links__link"
      [routerLink]="link.href"
      [attr.aria-label]="label"
      [matTooltip]="label"
      matTooltipPosition="above">
      <ds-lordicon class="contact-links__icon" [icon]="link.icon">
        <span class="cv-icon" [class]="'cv-icon-' + link.icon"></span>
      </ds-lordicon>
    </a>
    } @else {
    <a
      class="contact-links__link"
      [href]="link.href"
      [attr.aria-label]="label"
      [matTooltip]="label"
      matTooltipPosition="above">
      <ds-lordicon class="contact-links__icon" [icon]="link.icon">
        <span class="cv-icon" [class]="'cv-icon-' + link.icon"></span>
      </ds-lordicon>
    </a>
    }
  </li>
  }
</ul>
}

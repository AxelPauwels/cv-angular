name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:

permissions:
  actions: read
  contents: read

# Nx Cloud read-write CI token; anonymous access to the remote cache is disabled
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci
      # The dev environment imports the gitignored Tolgee tokens; use the empty template
      - run: cp apps/cv/src/tokens/environment.tokens.example.ts apps/cv/src/tokens/environment.tokens.ts
      - run: npx playwright install --with-deps

      # Sets NX_BASE and NX_HEAD so `nx affected` compares against the last successful run on main
      - uses: nrwl/nx-set-shas@v5

      - run: npx nx format:check
      # Fails when an icon is missing from the subset Material Symbols font in index.html
      - run: npx nx run cv:material-symbols
      # Pushes to main and develop run every project (unchanged ones come from the
      # cache) so Nx Cloud holds a result for each one and local runs after a pull
      # get remote hits; local tokens are read-only, so only CI fills the cache.
      # Pull requests and release branches only run what changed.
      - run: npx nx ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop') && 'run-many' || 'affected' }} -t lint test build typecheck --configuration=ci
      # Without --configuration: the same task as `nx run cv-e2e:e2e` in
      # build-production.sh, so the release and deploy builds reuse this result
      # from Nx Cloud instead of running every test again
      - run: npx nx affected -t e2e
        env:
          # Chromium only for day-to-day work; every browser on release
          # branches, main and pull requests into main (see playwright.config.mts)
          # (an empty value means every browser; `cond && '' || x` would always give x)
          E2E_BROWSERS: ${{ !(github.ref_name == 'main' || startsWith(github.ref_name, 'release/') || github.base_ref == 'main') && 'chromium' || '' }}

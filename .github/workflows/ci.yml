name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci
      # The dev environment imports the gitignored Tolgee tokens; use the empty template
      - run: cp apps/cv/src/tokens/environment.tokens.example.ts apps/cv/src/tokens/environment.tokens.ts
      - run: npx playwright install --with-deps

      # Sets NX_BASE and NX_HEAD so `nx affected` compares against the last successful run on main
      - uses: nrwl/nx-set-shas@v5

      - run: npx nx format:check
      # Fails when an icon is missing from the subset Material Symbols font in index.html
      - run: npx nx run cv:material-symbols
      - run: npx nx affected -t lint test build typecheck e2e --configuration=ci

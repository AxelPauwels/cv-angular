name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    # Release PRs into main get their preview from release.yml, after the version commit
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(github.base_ref == 'main' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      # build:production runs the e2e tests to include their report
      - run: npx playwright install --with-deps
      - run: npm run build:production
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AXEL_PAUWELS }}
          projectId: axel-pauwels
